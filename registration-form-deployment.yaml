apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-deployment
  labels:
    app: registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
        - name: registration-container
          image: registration-form:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
